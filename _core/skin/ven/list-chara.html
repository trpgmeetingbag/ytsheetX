<article>
      <h1>キャラクター一覧</h1>
      <a class="search-button" onclick="toggleHide('form-search')"></a>
      <form method="get" action="./" name="search" id="form-search" class="hide">
        <h3>検索条件</h3>
        <TMPL_IF LOGIN_ID><label class="mylist"><input type="checkbox" name="mode" value="mylist" <TMPL_IF modeMylist>checked</TMPL_IF>>マイリスト内を検索</label></TMPL_IF>
        <dl>
          <dt>タグ
            <dd><input type="text" name="tag" value="<TMPL_VAR tag>">
          <dt>グループ
            <dd><select name="group"><option value="all">すべて<TMPL_LOOP Groups><option value="<TMPL_VAR ID>" <TMPL_VAR SELECTED>><TMPL_VAR NAME></TMPL_LOOP></select>
          <dt>名前
            <dd><input type="text" name="name" value="<TMPL_VAR name>">
          <dt>ＰＬ名
            <dd><input type="text" name="player" value="<TMPL_VAR player>">
          <dt>レベル
            <dd><input type="number" name="level-min" value="<TMPL_VAR levelMin>" style="width:5em;"> ～ <input type="number" name="level-max" value="<TMPL_VAR levelMax>" style="width:5em;">
          <dt>属性
            <dd><input type="text" name="attribute" value="<TMPL_VAR attribute>">
          <dt>性別
            <dd>
              <label><input type="radio" name="gender" value="male"   <TMPL_VAR gender_male  >><span data-gender="male"  >♂</span></label>
              <label><input type="radio" name="gender" value="female" <TMPL_VAR gender_female>><span data-gender="female">♀</span></label>
              <label><input type="radio" name="gender" value="cross"  <TMPL_VAR gender_cross >><span data-gender="cross" >⚧</span></label>
              <label><input type="radio" name="gender" value="none"   <TMPL_VAR gender_none  >><span data-gender="none"  >―</span></label>
              <label><input type="radio" name="gender" value="unknown"<TMPL_VAR gender_unknown>><span data-gender="unknown">？</span></label>
          <dt>オリジン
            <dd><input type="text" name="origin" value="<TMPL_VAR origin>">
          <dt>アデプト
            <dd><input type="text" name="adept" value="<TMPL_VAR adept>">
          <dt>妖精／神
            <dd><input type="text" name="fairy" value="<TMPL_VAR fairy>">
          <dt>パワー系統
            <dd><input type="text" name="power-lineage" value="<TMPL_VAR powerLineage>">
          <dt>総資産
            <dd><input type="number" name="income-min" value="<TMPL_VAR incomeMin>" style="width:5em;"> ～ <input type="number" name="income-max" value="<TMPL_VAR incomeMax>" style="width:5em;">
          <dt>維持費
            <dd><input type="number" name="maint-min" value="<TMPL_VAR maintMin>" style="width:5em;"> ～ <input type="number" name="maint-max" value="<TMPL_VAR maintMax>" style="width:5em;">
          <dt>借金
            <dd><input type="number" name="debt-min" value="<TMPL_VAR debtMin>" style="width:5em;"> ～ <input type="number" name="debt-max" value="<TMPL_VAR debtMax>" style="width:5em;">
          <dt>画像
            <dd><label><input type="checkbox" name="image" value="1" <TMPL_IF image>checked</TMPL_IF>>あり</dd></label>
        </dl>
        <p class="right"><input type="submit" value="検索"></p>
      </form>
      <script src="<TMPL_VAR coreDir>/skin/_common/js/list.js?<TMPL_VAR ver>" defer></script>
      <TMPL_IF searchSummary><dl class="search-summary"><dt>検索結果<dd><TMPL_VAR searchSummary></dl></TMPL_IF>
      
      <TMPL_LOOP Lists>
      <section class="list" id="group-<TMPL_VAR ID>">
        <h2><TMPL_VAR NAME> <small><TMPL_VAR TEXT> (<TMPL_VAR NUM>)</small></h2>
        <TMPL_VAR PAGER>
        <TMPL_IF simpleList>
        <ul>
          <TMPL_LOOP Lines><li<TMPL_IF HIDE> class="hide"</TMPL_IF>>
            <a href="./?id=<TMPL_VAR ID>" data-lv="<TMPL_VAR LV>"><TMPL_VAR NAME><small><TMPL_VAR PLAYER></small></a>
          </TMPL_LOOP>
        </ul>
        <TMPL_ELSE>
        <table>
          <thead>
            <tr>
              <th class="name"><a href="./?group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=name">名前</a>
              <th class="player"><a href="./?group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=pl">プレイヤー</a>
              <th class="level"><a href="./?group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=lv">レベル</a>
              <th class="attribute"><span>属性</span>
              <th class="gender"><span>性別</span>
              <th class="age"><a href="./?group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=age">年齢</a>
              <th class="origin"><span>オリジン</span>
              <th class="adept"><span>アデプト</span>
              <th class="fairy"><span>妖精／神</span>
              <th class="income"><a href="./?group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=income">総資産</a>
              <th class="rest"><a href="./?group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=rest">所持金</a>
              <th class="maint"><a href="./?group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=maint">維持費</a>
              <th class="interest"><a href="./?group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=debt">借金</a>
              <th class="date"><a href="./?group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=date">更新<br>日時</a>
          </thead>
          <TMPL_LOOP Lines><tr<TMPL_IF HIDE> class="hide"</TMPL_IF>>
            <td class="name"><a href="./?id=<TMPL_VAR ID>"><TMPL_VAR NAME></a>
            <td class="player"><TMPL_VAR PLAYER>
            <td class="level"><TMPL_VAR LEVEL>
            <td class="attribute"><TMPL_VAR ATTRIBUTE>
            <td class="gender"><TMPL_VAR GENDER>
            <td class="age"><TMPL_VAR AGE>
            <td class="origin"><div><TMPL_VAR ORIGIN></div>
            <td class="adept"><div><TMPL_VAR ADEPT></div>
            <td class="fairy"><div><TMPL_VAR FAIRY></div>
            <td class="income"><TMPL_VAR INCOME>
            <td class="rest"><TMPL_VAR REST>
            <td class="maint"><TMPL_VAR MAINT>
            <td class="interest"><TMPL_VAR INTEREST>
            <td class="tags"><TMPL_VAR TAGS></td>
            <td class="date"><div><TMPL_VAR DATE></div>
          </TMPL_LOOP>
        </table>
        </TMPL_IF>
        <TMPL_VAR PAGER>
        <TMPL_IF MORE><p class="more"><a href="./?group=<TMPL_VAR ID>">>>MORE</a></p></TMPL_IF>
      </section>
      </TMPL_LOOP>
      
      <TMPL_IF simpleIndex><section class="list">
        <ul class="grouplist">
        <TMPL_LOOP Groups><li><a href="./?group=<TMPL_VAR ID>"><TMPL_VAR NAME><small><TMPL_VAR TEXT></small></a></TMPL_LOOP>
        </ul>
      </section></TMPL_IF>
    </article>
    <div id="page-top-button"><a href="#"></a></div>
