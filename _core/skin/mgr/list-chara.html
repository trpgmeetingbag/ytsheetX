<article>
      <h1>キャラクター一覧</h1>
      <a class="search-button" onclick="toggleHide('form-search')"></a>
      <form method="get" action="./" name="search" id="form-search" class="hide">
        <h3>検索条件</h3>
        <TMPL_IF LOGIN_ID><label class="mylist"><input type="checkbox" name="mode" value="mylist" <TMPL_IF modeMylist>checked</TMPL_IF>>マイリスト内を検索</label></TMPL_IF>
        <dl>
          <dt>タグ
            <dd><input type="text" name="tag" value="<TMPL_VAR tag>">
          <dt>グループ
            <dd><select name="group"><option value="all">すべて<TMPL_LOOP Groups><option value="<TMPL_VAR ID>" <TMPL_VAR SELECTED>><TMPL_VAR NAME></TMPL_LOOP></select>
          <dt>名前
            <dd><input type="text" name="name" value="<TMPL_VAR name>">
          <dt>ＰＬ名
            <dd><input type="text" name="player" value="<TMPL_VAR player>">
          <dt>カバー
            <dd><input type="text" name="cover" value="<TMPL_VAR cover>">
          <dt>機体名
            <dd><input type="text" name="mechaName" value="<TMPL_VAR mechaName>">
          <dt>経験点
            <dd><input type="number" name="exp-min" value="<TMPL_VAR expMin>" style="width:5em;"> ～ <input type="number" name="exp-max" value="<TMPL_VAR expMax>" style="width:5em;">
          <dt>クラス
            <dd><input type="text" name="class" value="<TMPL_VAR class>">
          <dt>性別
            <dd>
              <label><input type="radio" name="gender" value="male"   <TMPL_VAR genderMale  >><span data-gender="male"  >♂</span></label>
              <label><input type="radio" name="gender" value="female" <TMPL_VAR genderFemale>><span data-gender="female">♀</span></label>
              <label><input type="radio" name="gender" value="cross"  <TMPL_VAR genderCross >><span data-gender="cross" >⚧</span></label>
              <label><input type="radio" name="gender" value="none"   <TMPL_VAR genderNone  >><span data-gender="none"  >―</span></label>
          <dt>画像
            <dd><label><input type="checkbox" name="image" value="1" <TMPL_IF image>checked</TMPL_IF>>あり</label>
        </dl>
        <p class="right"><input type="submit" value="検索"></p>
      </form>
      <script src="<TMPL_VAR coreDir>/skin/_common/js/list.js?<TMPL_VAR ver>" defer></script>
      <TMPL_IF searchSummary><dl class="search-summary"><dt>検索結果<dd><TMPL_VAR searchSummary></dl></TMPL_IF>
      <TMPL_LOOP Lists>
      <section class="list" id="group-<TMPL_VAR ID>">
        <h2><TMPL_VAR NAME> <small><TMPL_VAR TEXT> (<TMPL_VAR NUM>)</small></h2>
        <TMPL_VAR PAGER>
        <TMPL_IF simpleList>
        <ul>
          <TMPL_LOOP Lines><li<TMPL_IF HIDE> class="hide"</TMPL_IF>>
            <a href="./?id=<TMPL_VAR ID>" data-lv="<TMPL_VAR LV>"><TMPL_VAR NAME><small><TMPL_VAR PLAYER></small></a>
          </TMPL_LOOP>
        </ul>
        <TMPL_ELSE>
        <table>
          <thead>
            <tr>
              <th class="name"><a href="./?group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=name">名前</a></th>
              <th class="player"><a href="./?group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=pl">プレイヤー</a></th>
              <th class="gender-age"><span>性別<br>年齢</span></th>
              <th class="cover-mecha"><span>カバー<br>機体名</span></th>
              <th class="lv-exp"><a href="./?group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=lv">CL<br>経験点</a></th>
              <th class="class"><span>クラス</span></th>
              <th class="date"><a href="./?group=<TMPL_VAR ID><TMPL_VAR qLinks>&sort=date">更新<br>日時</a></th>
            </tr>
          </thead>
          <TMPL_LOOP Lines>
            <tr<TMPL_IF HIDE> class="hide"</TMPL_IF>>
              <td class="name"><a href="./?id=<TMPL_VAR ID>"><TMPL_VAR NAME><TMPL_IF FELLOW><small class="fellow">[F]</small></TMPL_IF></a></td>
              <td class="player"><TMPL_VAR PLAYER></td>
              <td class="gender-age">
                <div class="gender"><TMPL_VAR GENDER></div>
                <div class="age"><TMPL_VAR AGE></div>
              </td>
              <td class="cover-mecha">
                <div class="cover"><TMPL_VAR COVER></div>
                <div class="mecha"><TMPL_VAR MECHA></div>
              </td>
              <td class="lv-exp">
                <div class="lv"><TMPL_VAR LV></div>
                <div class="exp"><TMPL_VAR EXP></div>
              </td>
              <td class="class"><TMPL_VAR CLASS_DISP></td>
              <td class="date"><div><TMPL_VAR DATE></div></td>
            </tr>
          </TMPL_LOOP>
        </table>
        </TMPL_IF>
        <TMPL_VAR PAGER>
        <TMPL_IF MORE><p class="more"><a href="./?group=<TMPL_VAR ID>">>>MORE</a></p></TMPL_IF>
      </section>
      </TMPL_LOOP>
      <TMPL_IF simpleIndex><section class="list">
        <ul class="grouplist">
        <TMPL_LOOP Groups><li><a href="./?group=<TMPL_VAR ID>"><TMPL_VAR NAME><small><TMPL_VAR TEXT></small></a></TMPL_LOOP>
        </ul>
      </section></TMPL_IF>
    </article>
    <div id="page-top-button"><a href="#"></a></div>
